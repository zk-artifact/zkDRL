[package]
name = "zkdrl-ctc-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
h32 = ["zkdrl-ctc-dqn/h32"]
h64 = ["zkdrl-ctc-dqn/h64"]
c128 = ["zkdrl-ctc-dqn/c128"]
c256 = ["zkdrl-ctc-dqn/c256"]

[dependencies]
anyhow = "1"
bincode = "1.3.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.8"
# Keep profiling enabled for the portable CPU executor (stale native-helper warm-cache bug).
sp1-sdk = { version = "=6.9.0", default-features = false, features = ["cuda", "native-gnark", "profiling"] }
sp1-verifier = { version = "=6.9.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zkdrl-ctc-dqn = { path = "../dqn/common" }
zkdrl-ctc-a2c = { path = "../a2c/common" }

[profile.release]
opt-level = 3
overflow-checks = false
